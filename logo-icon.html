<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .logo-wrap { width: 512px; height: 512px; position: relative; }
</style>
</head>
<body>
<div class="logo-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#39ff14" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background with circular gradient -->
  <rect width="512" height="512" rx="40" fill="#050a05"/>
  <circle cx="256" cy="256" r="250" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#39ff14" stroke-width="2" opacity="0.12"/>

  <!-- Biohazard symbol - larger, centered -->
  <g transform="translate(256,256) scale(1.4)" filter="url(#outerGlow)">
    <!-- Three crescents -->
    <g transform="rotate(0)">
      <path d="M0,-45 
        A70,70 0 0,1 39,-22.5
        A40,40 0 0,0 0,-85
        A40,40 0 0,0 -39,-22.5
        A70,70 0 0,1 0,-45Z" 
        fill="#39ff14"/>
      <path d="M-12,-80 L-8,-130 A25,25 0 0,1 8,-130 L12,-80" 
        fill="#39ff14"/>
    </g>
    <g transform="rotate(120)">
      <path d="M0,-45 
        A70,70 0 0,1 39,-22.5
        A40,40 0 0,0 0,-85
        A40,40 0 0,0 -39,-22.5
        A70,70 0 0,1 0,-45Z" 
        fill="#39ff14"/>
      <path d="M-12,-80 L-8,-130 A25,25 0 0,1 8,-130 L12,-80" 
        fill="#39ff14"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0,-45 
        A70,70 0 0,1 39,-22.5
        A40,40 0 0,0 0,-85
        A40,40 0 0,0 -39,-22.5
        A70,70 0 0,1 0,-45Z" 
        fill="#39ff14"/>
      <path d="M-12,-80 L-8,-130 A25,25 0 0,1 8,-130 L12,-80" 
        fill="#39ff14"/>
    </g>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="22" fill="#050a05"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#39ff14" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#39ff14" opacity="0.4"/>
  </g>
</svg>
</div>
</body>
</html>
