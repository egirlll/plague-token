<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .logo-wrap { width: 512px; height: 512px; }
</style>
</head>
<body>
<div class="logo-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2db812" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Exact biohazard geometry (from official SVG spec) -->
    <clipPath id="b">
      <circle cy="-15" r="9.5"/>
      <circle cy="-15" r="9.5" transform="rotate(120)"/>
      <circle cy="-15" r="9.5" transform="rotate(240)"/>
    </clipPath>
    <mask id="a" width="60" height="60" x="-30" y="-30" maskUnits="userSpaceOnUse">
      <path fill="#fff" d="M-27-27h54v54h-54z"/>
      <path d="M2-23v-4h-4v4M-.5-6v4h1v-4"/>
      <circle cy="-15" r="10.5"/>
      <g transform="rotate(120)">
        <path d="M2-23v-4h-4v4M-.5-6v4h1v-4"/>
        <circle cy="-15" r="10.5"/>
      </g>
      <g transform="rotate(240)">
        <path d="M2-23v-4h-4v4M-.5-6v4h1v-4"/>
        <circle cy="-15" r="10.5"/>
      </g>
      <circle r="3"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#050a05"/>
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>

  <!-- Biohazard symbol - exact geometry, scaled up, green -->
  <g transform="translate(256,256) scale(7.5)" filter="url(#glow)">
    <g mask="url(#a)">
      <circle cy="-11" r="15" fill="#2db812"/>
      <circle cy="-11" r="15" fill="#2db812" transform="rotate(120)"/>
      <circle cy="-11" r="15" fill="#2db812" transform="rotate(240)"/>
    </g>
    <circle r="11.75" fill="none" stroke="#2db812" stroke-width="3.5" clip-path="url(#b)"/>
  </g>
</svg>
</div>
</body>
</html>
