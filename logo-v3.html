<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .logo-wrap { width: 512px; height: 512px; }
</style>
</head>
<body>

<!-- OPTION B: Plague doctor mask -->
<div class="logo-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#050a05"/>
  <circle cx="256" cy="256" r="250" fill="url(#glowB)"/>

  <g transform="translate(256,240)" filter="url(#neonB)">
    <!-- Plague doctor mask - front view silhouette -->
    
    <!-- Hood/head outline -->
    <path d="M-90,-100 
      Q-100,-60 -95,-20
      Q-90,20 -80,40
      L-70,60
      Q-60,80 -50,90
      L-30,100
      Q0,108 30,100
      L50,90
      Q60,80 70,60
      L80,40
      Q90,20 95,-20
      Q100,-60 90,-100
      Q70,-140 0,-155
      Q-70,-140 -90,-100Z"
      fill="none" stroke="#39ff14" stroke-width="3" opacity="0.9"/>
    
    <!-- Left eye - round goggle -->
    <ellipse cx="-38" cy="-50" rx="28" ry="25" fill="none" stroke="#39ff14" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="-38" cy="-50" rx="18" ry="16" fill="#39ff14" opacity="0.1"/>
    <circle cx="-38" cy="-50" r="6" fill="#39ff14" opacity="0.4"/>
    
    <!-- Right eye - round goggle -->
    <ellipse cx="38" cy="-50" rx="28" ry="25" fill="none" stroke="#39ff14" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="38" cy="-50" rx="18" ry="16" fill="#39ff14" opacity="0.1"/>
    <circle cx="38" cy="-50" r="6" fill="#39ff14" opacity="0.4"/>
    
    <!-- Beak -->
    <path d="M-22,-15 
      Q-25,10 -20,30
      Q-15,50 -10,65
      Q-5,80 0,90
      Q5,80 10,65
      Q15,50 20,30
      Q25,10 22,-15"
      fill="none" stroke="#39ff14" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Beak ridge line -->
    <line x1="0" y1="-10" x2="0" y2="85" stroke="#39ff14" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Beak cross stitches -->
    <line x1="-15" y1="15" x2="15" y2="15" stroke="#39ff14" stroke-width="1" opacity="0.3"/>
    <line x1="-12" y1="35" x2="12" y2="35" stroke="#39ff14" stroke-width="1" opacity="0.3"/>
    <line x1="-8" y1="55" x2="8" y2="55" stroke="#39ff14" stroke-width="1" opacity="0.3"/>
    
    <!-- Forehead band -->
    <path d="M-85,-30 Q0,-45 85,-30" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Hat brim suggestion -->
    <path d="M-100,-105 Q0,-120 100,-105" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.25"/>
  </g>
</svg>
</div>

</body>
</html>
