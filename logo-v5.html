<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .logo-wrap { width: 512px; height: 512px; }
</style>
</head>
<body>
<div class="logo-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#050a05"/>
  <circle cx="256" cy="256" r="250" fill="url(#glow)"/>
  
  <!-- Standard biohazard symbol - proper geometry, green -->
  <g transform="translate(256,256) scale(1.55)" filter="url(#neonGlow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="138" fill="none" stroke="#39ff14" stroke-width="6"/>
    
    <!-- Three arcs on outer ring (gaps) - using black to cut gaps -->
    <g>
      <!-- Gap masks on outer ring -->
      <line x1="0" y1="-125" x2="0" y2="-151" stroke="#050a05" stroke-width="18"/>
      <line x1="108.3" y1="62.5" x2="130.8" y2="75.5" stroke="#050a05" stroke-width="18"/>
      <line x1="-108.3" y1="62.5" x2="-130.8" y2="75.5" stroke="#050a05" stroke-width="18"/>
    </g>
    
    <!-- Three crescents/lobes -->
    <!-- Each lobe: large arc with inner cutout -->
    
    <!-- Top lobe -->
    <path d="M-26,-16 A55,55 0 1,1 26,-16 A30,30 0 1,0 -26,-16Z" fill="#39ff14"/>
    
    <!-- Bottom-right lobe -->
    <path d="M13.5,23.4 A55,55 0 1,1 26,-16 A30,30 0 1,0 13.5,23.4Z" fill="#39ff14" transform="rotate(120)"/>

    <!-- Bottom-left lobe -->  
    <path d="M13.5,23.4 A55,55 0 1,1 26,-16 A30,30 0 1,0 13.5,23.4Z" fill="#39ff14" transform="rotate(240)"/>
    
    <!-- Center hole -->
    <circle cx="0" cy="0" r="18" fill="#050a05"/>
  </g>
</svg>
</div>
</body>
</html>
